[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopscope-fla"
version = "1.0.0"
description = "A proof-carrying restricted-case analyser for infinite-loop detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LoopScope FLA Team"}]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=7.0"]
plots = ["matplotlib>=3.7"]

[project.scripts]
loopscope = "loopscope.cli:main"

[tool.setuptools]
packages = ["loopscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
